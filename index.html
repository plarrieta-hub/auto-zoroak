<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO ZOROAK v2.2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#stage{
  position:relative;
  width:min(100vw,150vh);
  aspect-ratio:3/2;
  margin:auto;
background-image:url("auto-zoroak-v3.png");
  background-size:100% 100%;
  background-repeat:no-repeat;
  background-position:center;
}

input{
  position:absolute;
  left:15.8%;
  top:22.9%;
  width:31.7%;
  height:5.4%;
  font-size:2vw;
  text-align:center;
  border:none;
  background:rgba(255,255,255,0.05);
  outline:none;
}

#estado{
  position:absolute;
  left:26%;
  top:37.1%;
  width:18%;
  height:3%;
  font-size:1.6vw;
  font-weight:bold;
  color:green;
  text-align:center;
}

#countdown{
  position:absolute;
  left:27%;
  top:42.5%;
  width:20%;
  height:8%;
  font-size:4vw;
  font-weight:bold;
  color:red;
  text-align:center;
}

#timer{
  position:absolute;
  left:20.8%;
  top:52.5%;
  width:26%;
  height:8%;
  font-size:5vw;
  font-weight:bold;
  text-align:center;
  color:black;
}

button{
  position:absolute;
  border:none;
  background:transparent;
  color:transparent;
  cursor:pointer;
}

#connectBtn{
  left:15.7%;
  top:30%;
  width:32%;
  height:5.8%;
}

#readyBtn{
  left:15.7%;
  top:64%;
  width:16%;
  height:6%;
}

#finishBtn{
  left:36.3%;
  top:64%;
  width:16.5%;
  height:6%;
}

#clearBtn{
  left:57.5%;
  top:73.8%;
  width:16.5%;
  height:7.2%;
}

#csvBtn{
  left:75%;
  top:73.8%;
  width:17.2%;
  height:7.2%;
}

#rankingBox{
  position:absolute;
  left:57.4%;
  top:36.7%;
  width:35.6%;
  height:35.2%;
  overflow-y:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:1.55vw;
  text-align:center;
}

td{
  height:5.85vh;
  padding:0.4vw;
  font-weight:bold;
  color:black;
  background:rgba(255,248,220,0.55);
}

.pos{width:22%}
.team{width:43%}
.time{width:35%}

@media(max-width:900px){
  table{font-size:2vw}
  #timer{font-size:6vw}
}
</style>
</head>

<body>

<div id="stage">

<input id="teamName" placeholder="">

<button id="connectBtn">KONEKTATU</button>
<div id="estado"></div>

<div id="countdown"></div>
<div id="timer">00:00.00</div>

<button id="readyBtn">PREST?</button>
<button id="finishBtn">HELMUGA</button>

<div id="rankingBox">
  <table>
    <tbody id="rankingBody"></tbody>
  </table>
</div>

<button id="clearBtn">GARBITU</button>
<button id="csvBtn">CSV</button>

</div>

<script>
let port;
let writer;

const estado=document.getElementById("estado");
const timerDisplay=document.getElementById("timer");
const countdownDisplay=document.getElementById("countdown");
const rankingBody=document.getElementById("rankingBody");

let startTime=0;
let elapsed=0;
let timerInterval=null;
let running=false;

let ranking=JSON.parse(localStorage.getItem("autoZoroakRanking") || "[]");

function saveRanking(){
  localStorage.setItem("autoZoroakRanking", JSON.stringify(ranking));
}

function formatTime(ms){
  const cent=Math.floor((ms%1000)/10);
  const sec=Math.floor(ms/1000)%60;
  const min=Math.floor(ms/60000);
  return String(min).padStart(2,"0")+":"+
         String(sec).padStart(2,"0")+"."+
         String(cent).padStart(2,"0");
}

function updateTimer(){
  const now=Date.now();
  timerDisplay.textContent=formatTime(elapsed+(now-startTime));
}

function startTimer(){
  elapsed=0;
  startTime=Date.now();
  running=true;
  clearInterval(timerInterval);
  timerInterval=setInterval(updateTimer,20);
}

function stopTimer(){
  if(!running) return;
  elapsed += Date.now()-startTime;
  clearInterval(timerInterval);
  timerInterval=null;
  running=false;
  timerDisplay.textContent=formatTime(elapsed);
}

function resetTimer(){
  elapsed=0;
  running=false;
  clearInterval(timerInterval);
  timerInterval=null;
  timerDisplay.textContent="00:00.00";
}

function renderRanking(){
  ranking.sort((a,b)=>a.ms-b.ms);
  rankingBody.innerHTML="";
  ranking.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      "<td class='pos'>"+(i+1)+"</td>"+
      "<td class='team'>"+r.team+"</td>"+
      "<td class='time'>"+formatTime(r.ms)+"</td>";
    rankingBody.appendChild(tr);
  });
}

async function bidali(komandoa){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(komandoa.toString()));
}

document.getElementById("connectBtn").addEventListener("click", async()=>{
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:9600});
    writer=port.writable.getWriter();
    estado.textContent="Konektatuta";
  }catch(err){
    alert("Errorea: "+err);
  }
});

document.addEventListener("keydown", async(e)=>{
  if(e.repeat) return;

  switch(e.key){
    case "ArrowUp": await bidali("1"); break;
    case "ArrowDown": await bidali("2"); break;
    case "ArrowLeft": await bidali("4"); break;
    case "ArrowRight": await bidali("3"); break;
    case " ": await bidali("5"); break;

    case "a":
    case "A":
      document.getElementById("finishBtn").click();
      break;
  }
});

document.addEventListener("keyup", async(e)=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    await bidali("5");
  }
});

document.getElementById("readyBtn").addEventListener("click",()=>{
  const team=document.getElementById("teamName").value.trim();
  if(!team){
    alert("Idatzi taldearen izena.");
    return;
  }

  resetTimer();

  let steps=["3","2","1","GO!"];
  let i=0;
  countdownDisplay.textContent=steps[i];

  const interval=setInterval(()=>{
    i++;
    if(i<steps.length){
      countdownDisplay.textContent=steps[i];
    }else{
      clearInterval(interval);
      countdownDisplay.textContent="GO!";
      startTimer();
      setTimeout(()=>countdownDisplay.textContent="",800);
    }
  },1000);
});

document.getElementById("finishBtn").addEventListener("click",()=>{
  const team=document.getElementById("teamName").value.trim();

  if(!running){
    alert("Kronometroa ez dago martxan.");
    return;
  }

  stopTimer();

  ranking.push({
    team:team,
    ms:elapsed
  });

  saveRanking();
  renderRanking();
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  if(confirm("Sailkapena ezabatu nahi duzu?")){
    ranking=[];
    saveRanking();
    renderRanking();
  }
});

document.getElementById("csvBtn").addEventListener("click",()=>{
  ranking.sort((a,b)=>a.ms-b.ms);

  let csv="Postua,Taldea,Denbora\n";

  ranking.forEach((r,i)=>{
    csv+=(i+1)+","+r.team+","+formatTime(r.ms)+"\n";
  });

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="auto_zoroak_sailkapena.csv";
  a.click();
  URL.revokeObjectURL(url);
});

renderRanking();
</script>

</body>
</html>
