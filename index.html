<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO ZOROAK</title>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    color:#1976d2;
}

button{
    padding:15px 25px;
    font-size:20px;
    margin:10px;
    cursor:pointer;
}

#estado{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.teklak{
    margin-top:30px;
    font-size:30px;
}

.koadroa{
    background:white;
    max-width:700px;
    margin:auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.aktibo{
    color:green;
}

</style>

</head>

<body>

<div class="koadroa">

<h1>🚗 AUTO ZOROAK</h1>

<button id="connectBtn">
KONEKTATU HC-06
</button>

<div id="estado">
Deskonektatuta
</div>

<div class="teklak">

↑ Aurrera<br><br>

← Ezkerra     
↓ Atzera
     → Eskuina

<br><br>

ESPAZIOA = GELDITU

</div>

</div>

<script>

let port;
let writer;

const estado=document.getElementById("estado");

async function bidali(komandoa){

    if(!writer) return;

    await writer.write(
        new TextEncoder().encode(
            komandoa.toString()
        )
    );
}

document.getElementById("connectBtn")
.addEventListener("click", async()=>{

try{

port=await navigator.serial.requestPort();

await port.open({
    baudRate:9600
});

writer=port.writable.getWriter();

estado.innerHTML="🟢 Konektatuta";
estado.classList.add("aktibo");

}catch(err){

alert("Errorea: "+err);

}

});

document.addEventListener("keydown", async(e)=>{

switch(e.key){

case "ArrowUp":
await bidali("1");
break;

case "ArrowDown":
await bidali("2");
break;

case "ArrowLeft":
await bidali("3");
break;

case "ArrowRight":
await bidali("4");
break;

case " ":
await bidali("5");
break;

}

});

document.addEventListener("keyup", async(e)=>{

if(
e.key==="ArrowUp" ||
e.key==="ArrowDown" ||
e.key==="ArrowLeft" ||
e.key==="ArrowRight"
){

await bidali("5");

}

});

</script>

</body>
</html>
