<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO ZOROAK v2.0</title>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f3f6fb;
  margin:0;
  padding:18px;
}
.koadroa{
  background:white;
  max-width:850px;
  margin:auto;
  padding:22px;
  border-radius:18px;
  box-shadow:0 0 18px rgba(0,0,0,.2);
}
h1{color:#1976d2;margin:8px}
input{
  padding:12px;
  font-size:20px;
  width:80%;
  max-width:420px;
  text-align:center;
  margin:8px;
}
button{
  padding:13px 22px;
  font-size:18px;
  margin:6px;
  cursor:pointer;
  border-radius:10px;
  border:1px solid #aaa;
}
#estado{
  font-size:21px;
  font-weight:bold;
  margin:10px;
}
.aktibo{color:green}
#countdown{
  font-size:70px;
  font-weight:bold;
  min-height:85px;
  color:#d32f2f;
}
#timer{
  font-size:58px;
  font-weight:bold;
  margin:10px;
}
.teklak{
  font-size:28px;
  margin:18px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  font-size:18px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
}
th{
  background:#1976d2;
  color:white;
}
</style>
</head>

<body>

<div class="koadroa">

<h1>🏁 AUTO ZOROAK v2.0</h1>

<input id="teamName" placeholder="Taldearen izena">

<br>

<button id="connectBtn">KONEKTATU HC-06</button>
<div id="estado">Deskonektatuta</div>

<div id="countdown"></div>
<div id="timer">00:00.00</div>

<button id="readyBtn">PREST?</button>
<button id="finishBtn">HELMUGA</button>

<div class="teklak">
↑ Aurrera<br><br>
← Ezkerra &nbsp;&nbsp;&nbsp; ↓ Atzera &nbsp;&nbsp;&nbsp; → Eskuina
<br><br>
Tekla askatzean autoa gelditzen da
</div>

<h2>🏆 SAILKAPEN OROKORRA</h2>

<table>
<thead>
<tr>
<th>Postua</th>
<th>Taldea</th>
<th>Denbora</th>
</tr>
</thead>
<tbody id="rankingBody"></tbody>
</table>

<br>

<button id="clearBtn">GARBITU SAILKAPENA</button>
<button id="csvBtn">CSV DESKARGATU</button>

</div>

<script>
let port;
let writer;

const estado=document.getElementById("estado");
const timerDisplay=document.getElementById("timer");
const countdownDisplay=document.getElementById("countdown");
const rankingBody=document.getElementById("rankingBody");

let startTime=0;
let elapsed=0;
let timerInterval=null;
let running=false;

let ranking=JSON.parse(localStorage.getItem("autoZoroakRanking") || "[]");

function saveRanking(){
  localStorage.setItem("autoZoroakRanking", JSON.stringify(ranking));
}

function formatTime(ms){
  const cent=Math.floor((ms%1000)/10);
  const sec=Math.floor(ms/1000)%60;
  const min=Math.floor(ms/60000);
  return String(min).padStart(2,"0")+":"+
         String(sec).padStart(2,"0")+"."+
         String(cent).padStart(2,"0");
}

function updateTimer(){
  const now=Date.now();
  const total=elapsed+(now-startTime);
  timerDisplay.textContent=formatTime(total);
}

function startTimer(){
  elapsed=0;
  startTime=Date.now();
  running=true;
  clearInterval(timerInterval);
  timerInterval=setInterval(updateTimer,20);
}

function stopTimer(){
  if(!running) return;
  elapsed += Date.now()-startTime;
  clearInterval(timerInterval);
  timerInterval=null;
  running=false;
  timerDisplay.textContent=formatTime(elapsed);
}

function resetTimer(){
  elapsed=0;
  running=false;
  clearInterval(timerInterval);
  timerInterval=null;
  timerDisplay.textContent="00:00.00";
}

function renderRanking(){
  ranking.sort((a,b)=>a.ms-b.ms);
  rankingBody.innerHTML="";
  ranking.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+(i+1)+"</td>"+
      "<td>"+r.team+"</td>"+
      "<td>"+formatTime(r.ms)+"</td>";
    rankingBody.appendChild(tr);
  });
}

async function bidali(komandoa){
  if(!writer) return;
  await writer.write(new TextEncoder().encode(komandoa.toString()));
}

document.getElementById("connectBtn").addEventListener("click", async()=>{
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:9600});
    writer=port.writable.getWriter();
    estado.innerHTML="🟢 Konektatuta";
    estado.classList.add("aktibo");
  }catch(err){
    alert("Errorea: "+err);
  }
});

document.addEventListener("keydown", async(e)=>{
  if(e.repeat) return;

  switch(e.key){
    case "ArrowUp": await bidali("1"); break;
    case "ArrowDown": await bidali("2"); break;
    case "ArrowLeft": await bidali("4"); break;
    case "ArrowRight": await bidali("3"); break;
    case " ": await bidali("5"); break;
  }
});

document.addEventListener("keyup", async(e)=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    await bidali("5");
  }
});

document.getElementById("readyBtn").addEventListener("click",()=>{
  const team=document.getElementById("teamName").value.trim();
  if(!team){
    alert("Idatzi taldearen izena.");
    return;
  }

  resetTimer();

  let steps=["3","2","1","GO!"];
  let i=0;
  countdownDisplay.textContent=steps[i];

  const interval=setInterval(()=>{
    i++;
    if(i<steps.length){
      countdownDisplay.textContent=steps[i];
    }else{
      clearInterval(interval);
      countdownDisplay.textContent="GO!";
      startTimer();
      setTimeout(()=>countdownDisplay.textContent="",800);
    }
  },1000);
});

document.getElementById("finishBtn").addEventListener("click",()=>{
  const team=document.getElementById("teamName").value.trim();
  if(!running){
    alert("Kronometroa ez dago martxan.");
    return;
  }

  stopTimer();

  ranking.push({
    team:team,
    ms:elapsed
  });

  saveRanking();
  renderRanking();
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  if(confirm("Sailkapena ezabatu nahi duzu?")){
    ranking=[];
    saveRanking();
    renderRanking();
  }
});

document.getElementById("csvBtn").addEventListener("click",()=>{
  ranking.sort((a,b)=>a.ms-b.ms);

  let csv="Postua,Taldea,Denbora\n";

  ranking.forEach((r,i)=>{
    csv+=(i+1)+","+r.team+","+formatTime(r.ms)+"\n";
  });

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="auto_zoroak_sailkapena.csv";
  a.click();
  URL.revokeObjectURL(url);
});

renderRanking();
</script>

</body>
</html>
